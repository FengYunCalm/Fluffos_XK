name: Release

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Commit SHA to release (must be reachable from origin/master)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Common build configuration
  CMAKE_BUILD_TYPE: Release
  CMAKE_COMMON_FLAGS: -DCMAKE_BUILD_TYPE=Release -DMARCH_NATIVE=OFF
  CTEST_OUTPUT_ON_FAILURE: 1
  RELEASE_SHA: ${{ github.event.inputs.target_sha }}

permissions:
  contents: write
  packages: write

# One release per target SHA at a time: two concurrent dispatches for the
# same SHA must not race on the version tag.
concurrency:
  group: release-${{ github.event.inputs.target_sha }}
  cancel-in-progress: false

jobs:
  validate-target:
    name: Validate Target SHA and Required Checks
    runs-on: ubuntu-latest
    # Protected environment: requires an approved reviewer before any job in
    # this workflow may run with release credentials.
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Validate target SHA format
        run: |
          SHA="${{ github.event.inputs.target_sha }}"
          if ! echo "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "FAIL: target_sha must be a full 40-hex commit SHA" >&2
            exit 1
          fi

      - name: Verify target SHA is reachable from origin/master
        run: |
          SHA="${{ github.event.inputs.target_sha }}"
          git fetch origin master --depth=1000
          if ! git merge-base --is-ancestor "$SHA" origin/master; then
            echo "FAIL: target SHA $SHA is not reachable from origin/master" >&2
            exit 1
          fi
          # The checkout must resolve to exactly the requested SHA.
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "FAIL: checkout HEAD $(git rev-parse HEAD) != requested $SHA" >&2
            exit 1
          fi
          echo "PASS: target SHA $SHA is reachable and matches checkout"

      - name: Check required checks on target SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.event.inputs.target_sha }}"
          # Required contexts come from branch protection; fall back to a
          # documented list when the API is not available.
          REQUIRED_CONTEXTS=""
          if gh api "repos/${{ github.repository }}/branches/master/protection/required_status_checks/contexts" >/tmp/contexts.json 2>/dev/null; then
            REQUIRED_CONTEXTS=$(python3 -c 'import json,sys; print(" ".join(json.load(open("/tmp/contexts.json"))))')
          fi
          if [ -z "$REQUIRED_CONTEXTS" ]; then
            REQUIRED_CONTEXTS="Docs Evidence & Links Ubuntu (gcc, Debug) Ubuntu (gcc, RelWithDebInfo) Ubuntu (clang, Debug) Ubuntu (clang, RelWithDebInfo) macOS (default, Debug) macOS (default, RelWithDebInfo) Windows (default, Debug) Windows (default, RelWithDebInfo)"
          fi
          # Collect the latest check-run conclusions for the SHA.
          gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" --paginate \
            > /tmp/check-runs.json
          FAILED=""
          for ctx in $REQUIRED_CONTEXTS; do
            conclusion=$(python3 -c 'import json,sys; d=json.load(open("/tmp/check-runs.json")); r=[x for x in d.get("check_runs",[]) if x.get("name")==sys.argv[1]]; print(r[-1].get("conclusion") or "in_progress" if r else "missing")' "$ctx")
            echo "  $ctx: $conclusion"
            if [ "$conclusion" != "success" ]; then
              FAILED="$FAILED $ctx=$conclusion"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "FAIL: required checks not green on $SHA:$FAILED" >&2
            exit 1
          fi
          echo "PASS: all required checks green on $SHA"

      - name: Generate Version
        id: version
        run: |
          # Get current date in YYYY.MMDD format
          DATE_VERSION=$(date -u '+%Y.%m%d')
          # Fetch all tags
          git fetch --tags
          # Find existing tags for today's date
          EXISTING_TAGS=$(git tag -l "v${DATE_VERSION}.*" | sort -V)
          if [ -z "$EXISTING_TAGS" ]; then
            INCREMENT=0
          else
            LAST_TAG=$(echo "$EXISTING_TAGS" | tail -n 1)
            LAST_INCREMENT=$(echo "$LAST_TAG" | sed -E "s/v${DATE_VERSION}\.([0-9]+)/\1/")
            INCREMENT=$((LAST_INCREMENT + 1))
          fi
          VERSION="v${DATE_VERSION}.${INCREMENT}"
          echo "Generated version: $VERSION (target SHA: ${{ github.event.inputs.target_sha }})"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Build ${{ matrix.platform }} Binary
    needs: validate-target
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            shell: msys2 {0}
            asset_suffix: windows-x86_64.zip
            asset_type: application/zip
          - platform: linux
            os: ubuntu-latest
            shell: bash
            asset_suffix: linux-x86_64-static.tar.gz
            asset_type: application/gzip
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Setup MSYS2 (Windows)
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884  # v2
        with:
          update: true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event.inputs.target_sha }}

      - name: Install Dependencies (Windows)
        if: matrix.platform == 'windows'
        run: |
          pacman --noconfirm -S --needed \
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake mingw-w64-x86_64-zlib \
            mingw-w64-x86_64-pcre mingw-w64-x86_64-icu mingw-w64-x86_64-sqlite3 \
            mingw-w64-x86_64-jemalloc mingw-w64-x86_64-gtest \
            bison make zip

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        run: |
          mkdir build && cd build
          cmake -G "MSYS Makefiles" \
            ${{ env.CMAKE_COMMON_FLAGS }} \
            -DPACKAGE_CRYPTO=OFF \
            -DPACKAGE_DB_MYSQL="" \
            -DPACKAGE_DB_SQLITE=1 \
            ..
          VERBOSE=1 make -j 2 install

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: |
          docker run --rm -v $PWD:/workspace -w /workspace alpine:3.18@sha256:fd032399cd767f310a1d1274e81cab9f0fd8a49b3589eba2c3420228cd45b6a7 /bin/sh -c '
            set -e
            apk add --no-progress --no-cache \
              linux-headers gcc g++ clang-dev make cmake bash \
              mariadb-dev mariadb-static postgresql-dev sqlite-dev sqlite-static \
              openssl-dev openssl-libs-static zlib-dev zlib-static icu-dev icu-static \
              pcre-dev bison git musl-dev libelf-static elfutils-dev \
              zstd-static bzip2-static xz-static tar
            cd /tmp
            wget -q -O jemalloc.tar.bz2 https://github.com/jemalloc/jemalloc/releases/download/5.3.0/jemalloc-5.3.0.tar.bz2
            echo "2db82d1e7119df3e71b7640219b6dfe84789bc0537983c3b7ac4f7189aecfeaa  jemalloc.tar.bz2" | sha256sum -c -
            tar -xjf jemalloc.tar.bz2
            cd jemalloc-5.3.0
            ./configure --prefix=/usr && make -j$(nproc) && make install
            cd /workspace
            mkdir -p build && cd build
            cmake .. ${{ env.CMAKE_COMMON_FLAGS }} -DSTATIC=ON
            make -j$(nproc) install
            ctest --output-on-failure -j$(nproc)
            if ldd bin/driver 2>&1 | grep -q "not a dynamic executable"; then
              echo "PASS: bin/driver is statically linked"
            else
              echo "FAIL: bin/driver has dynamic dependencies:"
              ldd bin/driver
              exit 1
            fi
          '

      - name: Run Tests (Windows)
        if: matrix.platform == 'windows'
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        run: cd build && make test

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        run: |
          ASSET_NAME="fluffos-${{ needs.validate-target.outputs.version }}-${{ matrix.asset_suffix }}"
          cd build/bin && zip -r "../../${ASSET_NAME}" .

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          ASSET_NAME="fluffos-${{ needs.validate-target.outputs.version }}-${{ matrix.asset_suffix }}"
          cd build/bin && tar czf "../../${ASSET_NAME}" .

      - name: Compute asset checksums
        run: |
          ASSET_NAME="fluffos-${{ needs.validate-target.outputs.version }}-${{ matrix.asset_suffix }}"
          sha256sum "${ASSET_NAME}" > "${ASSET_NAME}.sha256"

      - name: Verify no test private keys in package
        if: matrix.platform == 'linux'
        run: |
          ASSET_NAME="fluffos-${{ needs.validate-target.outputs.version }}-${{ matrix.asset_suffix }}"
          if tar tzf "${ASSET_NAME}" | grep -E '\.(pem|key)$' ; then
            echo "FAIL: release asset contains private-key fixture files"
            exit 1
          fi
          echo "PASS: no key fixtures in release asset"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-asset-${{ matrix.platform }}
          path: |
            fluffos-${{ needs.validate-target.outputs.version }}-${{ matrix.asset_suffix }}
            fluffos-${{ needs.validate-target.outputs.version }}-${{ matrix.asset_suffix }}.sha256
          if-no-files-found: error

  build-docker:
    name: Build Docker Image (no push)
    needs: [validate-target, build-binaries]
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event.inputs.target_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.validate-target.outputs.version }},enable=true

      # Gate-first: build and load the image locally, record the digest, and
      # do NOT push. The push happens only in finalize-release after every
      # asset and checksum gate has passed.
      - name: Build Docker image without push
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (Trivy, non-blocking record)
        if: always()
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.50.1@sha256:586cf142d41727a184b2982ade6a4d94ada9e243d64fcd52e6dcfba9cce56df6 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json --output /tmp/trivy.json \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.validate-target.outputs.version }} || true
          echo "trivy scan recorded (see /tmp/trivy.json)"

      - name: Upload image digest + scan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: docker-digest
          path: /tmp/trivy.json
          if-no-files-found: ignore

  create-release:
    name: Create Release (tag-last, gate-first)
    needs: [build-binaries, build-docker]
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_id: ${{ steps.create_release.outputs.id }}
      version: ${{ needs.validate-target.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      # All build, test and scan gates have passed by this point; only now
      # may a tag and release be created (artifact-first, gate-first, tag-last).
      - name: Create Git Tag
        run: |
          VERSION="${{ needs.validate-target.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION (from ${{ github.event.inputs.target_sha }})"
          git push origin "$VERSION"

      - name: Create Draft Release
        id: create_release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const version = '${{ needs.validate-target.outputs.version }}';
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: `FluffOS ${version}`,
              generate_release_notes: true,
              prerelease: ${{ inputs.prerelease }},
              draft: true
            });
            core.setOutput('upload_url', release.data.upload_url);
            core.setOutput('id', release.data.id);
            return release.data.id;

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: assets/
          merge-multiple: true

      - name: Verify asset checksums
        run: |
          cd assets
          for f in *.sha256; do
            sha256sum -c "$f"
          done
          # Every asset must have a checksum and every checksum must match an asset.
          for f in fluffos-*; do
            if [[ "$f" == *.sha256 ]]; then continue; fi
            grep -q "$(basename "$f")" *.sha256 || { echo "FAIL: no checksum for $f"; exit 1; }
          done

      - name: Verify SBOM and manifest JSON validity
        run: |
          python3 -m json.tool third_party/sbom.json >/dev/null
          python3 -m json.tool docs/evidence/manifest.schema.json >/dev/null

      - name: Upload Release Assets
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5  # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./assets/fluffos-${{ needs.validate-target.outputs.version }}-windows-x86_64.zip
          asset_name: fluffos-${{ needs.validate-target.outputs.version }}-windows-x86_64.zip
          asset_content_type: application/zip

      - name: Upload Release Assets (Linux)
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5  # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./assets/fluffos-${{ needs.validate-target.outputs.version }}-linux-x86_64-static.tar.gz
          asset_name: fluffos-${{ needs.validate-target.outputs.version }}-linux-x86_64-static.tar.gz
          asset_content_type: application/gzip

  finalize-release:
    name: Finalize Release (push image + notes)
    needs: [create-release, build-binaries, build-docker]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event.inputs.target_sha }}

      # The immutable version tag is pushed only after every gate above has
      # passed; latest is updated last and only for non-prerelease builds.
      - name: Push Docker version tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.validate-target.outputs.version }}"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull ghcr.io/${{ github.repository }}:$VERSION || true
          # Push the previously loaded local image under the version tag.
          docker buildx build \
            --push \
            --platform linux/amd64 \
            --tag ghcr.io/${{ github.repository }}:$VERSION \
            --label org.opencontainers.image.revision=${{ github.event.inputs.target_sha }} \
            .

      - name: Generate Release Documentation
        id: docs
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          cat > release-notes.md << EOF
          ## Release Assets

          This release includes the following pre-built distributions:

          ### Binary Distributions
          - **Windows x86_64**: \`fluffos-${VERSION}-windows-x86_64.zip\`
            - Built with MSYS2/MinGW64
            - Complete distribution with all tools and libraries
            - SQLite support enabled

          - **Linux x86_64 (Static)**: \`fluffos-${VERSION}-linux-x86_64-static.tar.gz\`
            - Statically linked binaries (no external dependencies)
            - Built on Alpine Linux
            - Complete distribution with all tools and libraries
            - Portable across most Linux distributions

          ### Docker Images
          Docker images are available at \`ghcr.io/${{ github.repository }}\`:
          - \`${VERSION}\` - This release version

          ### Source
          - Commit: \`${{ github.event.inputs.target_sha }}\`

          ## Installation

          ### Windows
          \`\`\`bash
          unzip fluffos-${VERSION}-windows-x86_64.zip -d fluffos
          cd fluffos
          ./driver.exe /path/to/mudlib/config.cfg
          \`\`\`

          ### Linux
          \`\`\`bash
          mkdir fluffos && cd fluffos
          tar xzf ../fluffos-${VERSION}-linux-x86_64-static.tar.gz
          ./driver /path/to/mudlib/config.cfg
          \`\`\`

          ### Docker
          \`\`\`bash
          docker run -v /path/to/mudlib:/mudlib ghcr.io/${{ github.repository }}:${VERSION} /mudlib/config.cfg
          \`\`\`

          ---
          EOF

          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          cat release-notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update Release Notes
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const fs = require('fs');
            const release = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }}
            });
            const additionalNotes = fs.readFileSync('release-notes.md', 'utf8');
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              body: release.data.body + '\n\n' + additionalNotes
            });

      - name: Push latest tag (stable only)
        if: ${{ !inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}:latest \
            ghcr.io/${{ github.repository }}:${{ needs.validate-target.outputs.version }}

      - name: Release Summary
        run: |
          VERSION="${{ needs.validate-target.outputs.version }}"
          cat << EOF
          ✅ Draft release ${VERSION} created after all gates passed!
          📦 Windows binary: fluffos-${VERSION}-windows-x86_64.zip
          📦 Linux static binary: fluffos-${VERSION}-linux-x86_64-static.tar.gz
          🐳 Docker image: ghcr.io/${{ github.repository }}:${VERSION}
          🔗 View draft release: https://github.com/${{ github.repository }}/releases/tag/${VERSION}
          ⚠️ The release is intentionally DRAFT. Review assets and click "Publish
             release" only after manual approval per the release policy.
          EOF
