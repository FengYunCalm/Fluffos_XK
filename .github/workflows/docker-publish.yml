name: Docker

on:
  push:
    branches: [master]
    paths-ignore: ['docs/**']
  pull_request:
    branches: [master]
    paths-ignore: ['docs/**']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: read

# This workflow is a build-and-scan gate only. It never pushes images: the
# release workflow is the single entry point with push permission, and it
# only pushes after every gate (tests, sanitizers, fuzz, SBOM, checksums,
# vulnerability scan) has passed for the exact target SHA.
jobs:
  build-and-scan:
    name: Build Docker Image (no push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build Docker image without push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image builds and runs (smoke)
        run: |
          IMAGE=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -m1 "${{ env.IMAGE_NAME }}")
          test -n "$IMAGE"
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c 'test -x /usr/local/bin/driver || test -x /driver'
