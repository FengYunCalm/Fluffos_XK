    source: specs/recompile-arena/spec.md
    text: 所有权状态只有三种：准备前/完成后 Object owns attached payload；临时发布期间 Object owns new
      payload、migration owns old payload；回滚后 Object owns old payload、migration
      owns/discards new payload。析构、commit_finish() 和 rollback() 是 detached
      payload 的唯一释放者。
