  - id: A10
    source: specs/recompile-arena/spec.md
    text: exact layout 是否运行 __INIT 以及 init/migrate
      相对顺序由该表显式决定，不由"变量数量是否变化"或散落分支隐式决定。BlueprintFamily 的新 block 先运行 initializer
      再由旧值覆盖 matched 槽（新增变量保留 initializer）；Master/SimulEfun 先把旧值复制到独立新 block 再运行
      __INIT（__INIT 看到旧状态且写入不被迁移覆盖）。两种顺序都不修改旧 block，失败可完整回滚。
    result: pending
    reason: null
