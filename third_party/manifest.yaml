# Third-party dependency manifest
#
# Machine-readable inventory of every vendored dependency in src/thirdparty
# plus external downloads used by release builds. Every entry records the
# upstream source, version, license, and review status so upgrades can be
# audited. Fields marked `unknown` must be filled in before the dependency is
# upgraded or released.
#
# Review cadence: quarterly; bump `last_reviewed` when reviewed.

schema: fluffos.third_party.manifest.v1
last_reviewed: 2026-08-09

vendored:
  - name: argparse
    path: src/thirdparty/argparse
    version: unknown
    upstream: https://github.com/p-ranav/argparse
    license: MIT
    checksum: unknown
    patches: none
    notes: Single-header library under include/argparse/.

  - name: backward-cpp
    path: src/thirdparty/backward-cpp
    version: unknown
    upstream: https://github.com/bombela/backward-cpp
    license: MIT
    checksum: unknown
    patches: none
    notes: Used for crash stack traces.

