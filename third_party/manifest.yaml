  - name: github-actions
    note: Actions are pinned to major versions in workflows; commit-SHA pins
          are tracked and enforced by tools/docs/check-actions-pins.py (T08
          gate). The checker fails when a workflow uses an undeclared action
          or a manifest entry is unused.
    entries:
      - actions/checkout@v4
