# Third-party dependency manifest
#
# Machine-readable inventory of every vendored dependency in src/thirdparty
# plus external downloads used by release builds. Every entry records the
# upstream source, version, license, and review status so upgrades can be
# audited.
#
# `checksum` is the sha256 of the concatenation of all vendored files
# (excluding VCS metadata), sorted by path: a content fingerprint that
# changes when the vendored tree changes. It is not an upstream release
# checksum; pin upstream release digests separately.
#
# Review cadence: quarterly; bump `last_reviewed` when reviewed.

