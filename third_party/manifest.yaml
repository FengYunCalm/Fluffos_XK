external_downloads:
  - name: jemalloc
    version: 5.3.0
    url: https://github.com/jemalloc/jemalloc/releases/download/5.3.0/jemalloc-5.3.0.tar.bz2
    sha256: 2db82d1e7119df3e71b7640219b6dfe84789bc0537983c3b7ac4f7189aecfeaa
    license: BSD-2-Clause
    used_by: .github/workflows/release.yml (Linux static build)
    verification: sha256 must be checked before extraction; failure aborts the build

toolchain:
  - name: alpine-base-image
    version: 3.18
    digest: unknown
    license: MIT (Docker base image licensing per component)
    used_by: .github/workflows/release.yml (Linux static build), Dockerfile
    notes: Pin to an immutable digest before next release.

  - name: github-actions
    note: Pin action major versions + commit digests; record review date per action.
    entries:
      - actions/checkout@v4
      - actions/upload-artifact@v4
      - actions/download-artifact@v4
      - docker/setup-buildx-action@v3
      - docker/login-action@v3
      - docker/metadata-action@v5
      - docker/build-push-action@v5
      - actions/github-script@v7
